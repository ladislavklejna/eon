# EON Heating Configuration - Nginx Config
#
# Tento soubor zkopírujte na NAS do:
# /srv/dev-disk-by-uuid-XXXXXXX/eon/nginx/default.conf

server {
    listen 80;
    server_name _;

    # Logging
    access_log /var/log/nginx/eon-access.log;
    error_log /var/log/nginx/eon-error.log warn;

    # Zakázat přístup k root URL
    location / {
        return 404 "Not Found\n";
        add_header Content-Type text/plain;
    }

    # EON konfigurace endpoint
    location /eon/ {
        # Mountnutá složka z Dockeru
        alias /usr/share/nginx/html/eon/;

        # Zakázat listing souborů
        autoindex off;

        # CORS headers - povolit přístup z jakékoliv domény
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, X-Requested-With' always;
        add_header 'Access-Control-Max-Age' 1728000 always;

        # Cache control - vždy aktuální konfigurace
        add_header 'Cache-Control' 'no-cache, no-store, must-revalidate, max-age=0' always;
        add_header 'Pragma' 'no-cache' always;
        add_header 'Expires' '0' always;

        # Security headers
        add_header 'X-Content-Type-Options' 'nosniff' always;
        add_header 'X-Frame-Options' 'DENY' always;
        add_header 'X-XSS-Protection' '1; mode=block' always;
        add_header 'Referrer-Policy' 'no-referrer-when-downgrade' always;

        # CORS preflight request (OPTIONS)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, X-Requested-With';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Povolit pouze GET, HEAD, OPTIONS
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
            return 405 "Method Not Allowed\n";
        }

        # MIME types
        types {
            application/json json;
            text/plain txt log;
        }

        default_type application/json;

        # Povolit access k souborům
        try_files $uri $uri/ =404;
    }

    # Health check endpoint pro Docker
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Status endpoint (volitelné - pro debugging)
    location /status {
        access_log off;
        return 200 '{"status":"ok","service":"eon-nginx","version":"1.0"}\n';
        add_header Content-Type application/json;
    }

    # Zakázat přístup k hidden souborům
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Error pages
    error_page 404 /404.html;
    location = /404.html {
        internal;
        return 404 "Not Found\n";
        add_header Content-Type text/plain;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        return 500 "Internal Server Error\n";
        add_header Content-Type text/plain;
    }
}

# Poznámky:
# - CORS je nastaveno permisivně (*) pro jednoduchost
# - Pro produkci doporučuji omezit na konkrétní origin
# - Cache je zcela vypnutý pro vždy aktuální data
# - Port 80 je interní v kontejneru, navenek je mapovaný na 8080 (viz docker-compose.yml)
